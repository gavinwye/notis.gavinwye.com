# The website for notis.gavinwye.com. In Netlify, this project's base
# directory is `site`. It has no function: the demo keeps comments in the
# visitor's browser, so nobody can post to a server from the public page.
[build]
  # Writes comments.js, server/*.mjs, the versioned /v<version>/ copies and
  # version.json into this folder. Stops if package.json and the widget
  # disagree about the version.
  command = "node ../scripts/build.mjs --site ."
  publish = "."
  # The page is built from ../public, ../server and the version, so a change
  # there must rebuild the site too. Exit 0 means "nothing relevant changed,
  # skip the build".
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../public ../server ../scripts ../releases ../package.json ../CHANGELOG.md"
