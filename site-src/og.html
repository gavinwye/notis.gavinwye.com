<!doctype html>
<!-- Source for site/og.png (the share image). Not published.
     Regenerate: node scripts/og.mjs   (needs Playwright and Chrome; see the script) -->
<html lang="en"><head><meta charset="utf-8"><title>Notis share image</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px;background:#fff;color:#0b0c0c;font-family:"Figtree",Arial,Helvetica,sans-serif;overflow:hidden}
  .frame{position:relative;width:1200px;height:630px;padding:64px 72px;border-left:24px solid #ffc726}
  .brand{display:flex;align-items:center;gap:16px;font-size:40px;font-weight:800}
  .brand i{display:block;width:40px;height:40px;background:#ffc726}
  h1{margin-top:84px;font-size:92px;line-height:1.04;letter-spacing:-.025em;font-weight:800;max-width:960px}
  h1 mark{background:#fff3c4;color:inherit;border-bottom:8px solid #ffc726;padding:0 6px}
  .note{position:absolute;right:72px;bottom:64px;width:420px;border:3px solid #0b0c0c;background:#fff;padding:18px 20px}
  .note .q{font-size:22px;line-height:1.35;color:#505a5f}
  .note .q mark{background:#fff3c4;color:#0b0c0c;border-bottom:3px solid #ffc726}
  .note .who{margin-top:12px;font-size:17px;font-weight:700}
  .note .c{margin-top:4px;font-size:22px;font-weight:600}
  .url{position:absolute;left:72px;bottom:64px;font-size:30px;font-weight:700}
</style></head><body>
<div class="frame">
  <div class="brand"><i></i>Notis</div>
  <h1>Leave a note on <mark>the exact words</mark></h1>
  <div class="note">
    <div class="q">The intro <mark>feels long</mark> for a page this short.</div>
    <div class="who">Sam</div>
    <div class="c">Cut it to two sentences.</div>
  </div>
  <div class="url">notis.gavinwye.com</div>
</div>
</body></html>
